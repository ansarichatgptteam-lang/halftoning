name: CIFAR10 Assignment Parallel

on:
  push:
    branches: [cifar10-assignment-run]
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        experiment: [adam_no_aug, adam_aug, sgd_momentum_aug, adamw_aug]
    env:
      EPOCHS: '6'
      BATCH_SIZE: '256'
      EXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision tensorboard matplotlib
      - name: Run one experiment
        run: python cifar10_hw.py | tee training_log.txt
      - name: Package experiment artifact
        run: |
          cp cifar10_hw.py assignment_output/cifar10_hw.py
          cp training_log.txt assignment_output/training_log_${EXPERIMENT}.txt
          zip -r result_${EXPERIMENT}.zip assignment_output
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.experiment }}
          path: result_${{ matrix.experiment }}.zip
          retention-days: 7
